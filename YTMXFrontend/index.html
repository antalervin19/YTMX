<!DOCTYPE html>
<html lang="en">
<head>

    <title>YTMX</title>
</head>
<body>
    <aside class="sidebar">
        <h2>YTMX</h2>

        <nav>

            <a href="#" red-switch="group-jam">Group Jam</a>

    <main red-root></main>

    <div class="playbar">

                <strong id="track-title">Nothing Playing</strong>

        <div class="player-controls">
            <button id="previous"><<</button>

        </div>

        <div class="progress">
            <span id="current-time">0:00</span>
            <input id="progress-bar" type="range" min="0" max="100" value="0">
            <span id="duration">0:00</span>
        </div>

        <div class="volume">
            <))
            <input type="range" min="0" max="100" value="75">
